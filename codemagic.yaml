workflows:
  android-release:
    name: Android Release (AAB)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - google_play # Optional for Play Store publishing
      vars:
        PACKAGE_NAME: "com.prch.cauldron"
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Build Android App Bundle (AAB)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt
    publishing:
      email:
        recipients:
          - prchglobal@gmail.com
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - ios/Pods
        - $HOME/.codemagic-signing
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.prch.cauldron"
        XCODE_PROJECT: "ios/PocketMystic.xcodeproj"
        XCODE_SCHEME: "PocketMystic"
        APP_STORE_CONNECT_ISSUER_ID: "ff7bcce5-78b8-4fee-8e43-19f66f0229b2"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "63Q95N82FJ"
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      tag_patterns:
        - pattern: "v*"
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set up code signing
        script: |
          set -euo pipefail
          keychain initialize
          SIGNING_CACHE_DIR="$HOME/.codemagic-signing"
          mkdir -p "$SIGNING_CACHE_DIR"
          KEY_PATH="$SIGNING_CACHE_DIR/ios_distribution_key.pem"

          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Using CERTIFICATE_PRIVATE_KEY from environment..."
            printf "%s\n" "$CERTIFICATE_PRIVATE_KEY" > "$KEY_PATH"
          elif [ ! -s "$KEY_PATH" ]; then
            echo "Generating persistent RSA 2048 private key for certificate..."
            openssl genrsa -out "$KEY_PATH" 2048
          else
            echo "Reusing cached RSA 2048 private key from $KEY_PATH..."
          fi

          if ! app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:"$KEY_PATH"; then
            echo "Handling Apple Distribution certificate limit..."
            CERT_IDS=$(app-store-connect certificates list --json 2>/dev/null | grep -oE '"id"[[:space:]]*:[[:space:]]*"[A-Z0-9]{10}"' | grep -oE '[A-Z0-9]{10}' || true)
            for CERT_ID in $CERT_IDS; do
              echo "Deleting certificate $CERT_ID..."
              app-store-connect certificates delete "$CERT_ID" || true
            done
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --create \
              --certificate-key=@file:"$KEY_PATH"
          fi

          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - "*.dSYM.zip"
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - prchglobal@gmail.com
        notify:
          success: true
          failure: true
