<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ontology mandala 2">
  <defs>
    <style> .s{fill:none;stroke:#2F4F4F;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <circle cx="32" cy="32" r="6" fill="#FFF8E1" stroke="#2F4F4F" stroke-width="1"/>
  <circle class="s" cx="32" cy="32" r="14"/>
  <circle class="s" cx="32" cy="32" r="24"/>
  <!-- eight triangles around -->
  <g transform="translate(32,32)">
    <g fill="#E8F6FF" stroke="#2F4F4F" stroke-width="1">
      <polygon points="0,-28 6,-16 -6,-16" transform="rotate(0)" />
      <polygon points="0,-28 6,-16 -6,-16" transform="rotate(45)" />
      <polygon points="0,-28 6,-16 -6,-16" transform="rotate(90)" />
      <polygon points="0,-28 6,-16 -6,-16" transform="rotate(135)" />
      <polygon points="0,-28 6,-16 -6,-16" transform="rotate(180)" />
      <polygon points="0,-28 6,-16 -6,-16" transform="rotate(225)" />
      <polygon points="0,-28 6,-16 -6,-16" transform="rotate(270)" />
      <polygon points="0,-28 6,-16 -6,-16" transform="rotate(315)" />
    </g>
  </g>
</svg>
